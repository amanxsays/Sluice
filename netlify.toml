[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.14.0"

# Set VITE_API_BASE_URL=https://YOUR_BACKEND.onrender.com in Netlify's build environment.
# The backend allows your frontend origin through SLUICE_CORS_ALLOWED_ORIGINS.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
